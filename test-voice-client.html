<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice WebSocket Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            line-height: 1.6;
        }
        button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        #recordButton.recording {
            background-color: #f44336;
        }
        .container {
            margin-top: 2rem;
            padding: 1rem;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        #log {
            background-color: #f8f9fa;
            padding: 1rem;
            border-radius: 4px;
            height: 200px;
            overflow-y: auto;
            margin-top: 1rem;
            font-family: monospace;
        }
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
        }
        .status-connected {
            background-color: #4CAF50;
        }
        .status-disconnected {
            background-color: #f44336;
        }
        .status-connecting {
            background-color: #ff9800;
        }
    </style>
</head>
<body>
    <h1>Voice WebSocket Test</h1>
    
    <div class="container">
        <h2>WebSocket Status: 
            <span id="statusText">Disconnected</span>
            <span class="status-indicator status-disconnected" id="statusIndicator"></span>
        </h2>
        
        <button id="connectButton">Connect to WebSocket</button>
        <button id="disconnectButton" disabled>Disconnect</button>
    </div>
    
    <div class="container">
        <h2>Voice Recording</h2>
        <button id="recordButton" disabled>Start Recording</button>
        
        <div>
            <h3>Transcription:</h3>
            <p id="transcription">No transcription yet.</p>
        </div>
        
        <div>
            <h3>Response:</h3>
            <p id="response">No response yet.</p>
        </div>
    </div>
    
    <div class="container">
        <h2>Log</h2>
        <div id="log"></div>
    </div>

    <script>
        // DOM Elements
        const connectButton = document.getElementById('connectButton');
        const disconnectButton = document.getElementById('disconnectButton');
        const recordButton = document.getElementById('recordButton');
        const statusText = document.getElementById('statusText');
        const statusIndicator = document.getElementById('statusIndicator');
        const transcriptionElement = document.getElementById('transcription');
        const responseElement = document.getElementById('response');
        const logElement = document.getElementById('log');
        
        // WebSocket and AudioRecorder state
        let socket;
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        
        // Log Function
        function log(message) {
            const now = new Date().toLocaleTimeString();
            logElement.innerHTML += `<div>[${now}] ${message}</div>`;
            logElement.scrollTop = logElement.scrollHeight;
        }
        
        // Update connection status UI
        function updateConnectionStatus(status) {
            statusText.textContent = status;
            
            switch(status) {
                case 'Connected':
                    statusIndicator.className = 'status-indicator status-connected';
                    connectButton.disabled = true;
                    disconnectButton.disabled = false;
                    recordButton.disabled = false;
                    break;
                case 'Disconnected':
                    statusIndicator.className = 'status-indicator status-disconnected';
                    connectButton.disabled = false;
                    disconnectButton.disabled = true;
                    recordButton.disabled = true;
                    recordButton.textContent = 'Start Recording';
                    recordButton.classList.remove('recording');
                    isRecording = false;
                    break;
                case 'Connecting':
                    statusIndicator.className = 'status-indicator status-connecting';
                    connectButton.disabled = true;
                    disconnectButton.disabled = true;
                    recordButton.disabled = true;
                    break;
            }
        }
        
        // Connect to WebSocket
        connectButton.addEventListener('click', () => {
            updateConnectionStatus('Connecting');
            
            const wsUrl = 'ws://localhost:3000/ws/voice';
            socket = new WebSocket(wsUrl);
            
            socket.binaryType = 'arraybuffer'; // Important for binary audio data
            
            socket.onopen = () => {
                log('WebSocket connection established');
                updateConnectionStatus('Connected');
            };
            
            socket.onclose = (event) => {
                log(`WebSocket connection closed: ${event.code} ${event.reason}`);
                updateConnectionStatus('Disconnected');
                stopRecording();
            };
            
            socket.onerror = (error) => {
                log(`WebSocket error: ${error}`);
            };
            
            socket.onmessage = (event) => {
                // Handle binary audio data (response audio)
                if (event.data instanceof ArrayBuffer) {
                    log(`Received audio data: ${event.data.byteLength} bytes`);
                    playAudio(event.data);
                } 
                // Handle JSON messages
                else {
                    try {
                        const message = JSON.parse(event.data);
                        log(`Received message: ${JSON.stringify(message)}`);
                        
                        if (message.type === 'transcription') {
                            transcriptionElement.textContent = message.text;
                        }
                        else if (message.type === 'response') {
                            responseElement.textContent = message.text;
                        }
                        else if (message.type === 'error') {
                            log(`Error: ${message.message}`);
                        }
                    } catch (error) {
                        log(`Error parsing WebSocket message: ${error}`);
                    }
                }
            };
        });
        
        // Disconnect from WebSocket
        disconnectButton.addEventListener('click', () => {
            if (socket) {
                socket.close();
            }
        });
        
        // Toggle recording
        recordButton.addEventListener('click', async () => {
            if (isRecording) {
                stopRecording();
            } else {
                await startRecording();
            }
        });
        
        // Start recording
        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                
                // Notify server recording started
                if (socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({ type: 'start-recording' }));
                }
                
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                        
                        // Send audio data to server
                        if (socket && socket.readyState === WebSocket.OPEN) {
                            // Convert Blob to ArrayBuffer
                            const reader = new FileReader();
                            reader.onload = () => {
                                socket.send(reader.result);
                            };
                            reader.readAsArrayBuffer(event.data);
                            
                            // Also send message type
                            socket.send(JSON.stringify({ type: 'audio-data' }));
                        }
                    }
                };
                
                mediaRecorder.onstop = () => {
                    // Notify server recording stopped
                    if (socket && socket.readyState === WebSocket.OPEN) {
                        socket.send(JSON.stringify({ type: 'stop-recording' }));
                    }
                    
                    // Stop all tracks on the stream
                    stream.getTracks().forEach(track => track.stop());
                };
                
                // Start recording with 100ms chunks
                mediaRecorder.start(100);
                isRecording = true;
                recordButton.textContent = 'Stop Recording';
                recordButton.classList.add('recording');
                log('Recording started');
                
            } catch (error) {
                log(`Error starting recording: ${error}`);
            }
        }
        
        // Stop recording
        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                recordButton.textContent = 'Start Recording';
                recordButton.classList.remove('recording');
                log('Recording stopped');
            }
        }
        
        // Play audio response
        function playAudio(audioData) {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            
            audioContext.decodeAudioData(audioData, (buffer) => {
                const source = audioContext.createBufferSource();
                source.buffer = buffer;
                source.connect(audioContext.destination);
                source.start(0);
                log('Playing audio response');
            }).catch(error => {
                log(`Error decoding audio data: ${error}`);
            });
        }
        
        // When page unloads, close connections
        window.addEventListener('beforeunload', () => {
            if (socket) {
                socket.close();
            }
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
            }
        });
        
        // Init with disconnected status
        updateConnectionStatus('Disconnected');
        log('Voice WebSocket Test page loaded');
    </script>
</body>
</html>
